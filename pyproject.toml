[project]
name = "magutils"
version = "0.3.5"
description = "Набор удобных инструментов для Python приложений."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "orjson>=3.11.4",
    "pydantic>=2.12.5",
    "babel>=2.17.0",
    "nanoid>=2.0.0",
    "cron-parser-py>=1.0.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "deptry>=0.24.0",
    "gitpython>=3.1.46",
    "pathspec>=1.0.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "telegrinder>=0.5.1",
    "fastapi[standard]>=0.136.1",
    "ruff>=0.15.13",
    "starlark-pyo3>=2026.1",
]
k8s = [
    "kubernetes>=35.0.0",
]
fastapi = [
    "fastapi[standard]>=0.136.1",
]
telegrinder = [
    "telegrinder>=0.5.1",
]
all = [
    "fastapi[standard]>=0.136.1",
    "telegrinder>=0.5.1"
]


[tool.coverage.run]
source = ["./src/magutils"]

omit = [
    "__init__.py",
    "checkout_helper.py",
    "t.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "raise ImportError",
    "except ImportError",
    "return",
    "# nocov",
    "pass",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg", "babel", "tzdata"]
DEP004 = ["git", "kubernetes", "pathspec", "fastapi", "telegrinder", "starlark"]

[build-system]
requires = ["uv_build>=0.7.11,<0.8.0"]
build-backend = "uv_build"
